server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 本地私有配置（不入库）：真实数据库密码放在 application-local.yml，
  # 该文件已被 .gitignore 排除；首次克隆参考 application-local.yml.example 创建
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/property?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 严禁写默认密码：本地开发用 application-local.yml 提供，部署用 DB_PASSWORD 环境变量
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  redis:
    host: localhost
    port: 6379
    password:
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# JWT
# TODO: security — move jwt.secret to environment variable (e.g. ${JWT_SECRET})
# and never commit real secrets to version control.
jwt:
  secret: ${JWT_SECRET:PROPERTY_MGMT_SECRET_KEY_2024_CHANGE_IN_PROD}
  expiration: 86400000  # 24小时

# 微信小程序配置
# 安全要求：生产环境必须通过环境变量注入 WECHAT_APPID / WECHAT_SECRET，严禁写死
# 开发环境不配置时自动进入 Demo 模式（仅生成独立 demo 账号，碰不到真实数据）
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

# 文件上传
file:
  upload:
    path: /data/property/uploads/
    max-size: 10485760  # 10MB

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.property: debug
    org.springframework.security: warn
